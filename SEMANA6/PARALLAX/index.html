<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIPPATH SEMANA 6</title>
    <style>
        *{
            padding:0px;
            margin: 0px;
        }
        .contenedor{
            width: 2000px;
            height: 1200px;
            border: 1px solid black;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        .fondo{
            width: 100%;
            height: 100%;
            position: absolute;
            background-image: url(img/jefe.png);
            background-size: cover; 
            animation: fondo 10s linear infinite;
        }
        @keyframes fondo {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.25); 
            }
        }
        .personaje{
            width: 1000px;
            height: 600px;
            position: absolute;
            background-image: url(img/personaje.png);
            background-size: cover;
            top: 700px;
            left: 800px;
            animation: personaje1 10s linear infinite;
        }
         @keyframes personaje1{
            0%{
                top:700px;
                left: 600px;
            }
            100%{
                top:700px;
                left: 800px;
            }
        }
        .muro{
            width: 1500px;
            height: 100%;
            position: absolute;
            background-image: url(img/muro.png);
            background-size: cover;
            top: 0px;
            left: 0px;
            animation: muro1 10s linear infinite;
        }
        @keyframes muro1{
            0%{
                top:0px;
                left:-200px;
            }
            100%{
                top:0px;
                left:-800px;
            }
        }
        .regresar{
            width: 300px;
            height: 100px;
            font-size: 100px;
        }
    </style>
</head>
<body>
    <div class="contenedor"> 
        <div class="fondo">   
        </div>
        <div class="personaje">   
        </div>
        <div class="muro">   
        </div>
    </div>
    <div class="regresar">
        <a href="../"> regresar</a>
    </div>
</html>
